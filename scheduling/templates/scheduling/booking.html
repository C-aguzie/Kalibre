<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalibre — Book Appointment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; min-height: 100vh; }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 60px; border-bottom: 1px solid #1e1e2e;
        }
        .logo { font-family: "Cormorant Garamond", serif; font-size: 1.9rem; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(135deg, #fff 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-accent { color: #7c5cfc; }

        .page-wrapper {
            max-width: 620px; margin: 60px auto; padding: 0 20px;
        }
        .page-header { margin-bottom: 36px; }
        .page-header h1 {
            font-family: 'Space Grotesk', sans-serif; font-size: 2rem;
            font-weight: 700; color: #fff; margin-bottom: 8px;
        }
        .page-header p { color: #6b6b8a; font-size: 0.9rem; }

        .form-card {
            background: #0f0f1a; border: 1px solid #1e1e2e;
            border-radius: 16px; padding: 36px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #9090b0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

        input[type=text], input[type=email], input[type=date], input[type=time], select, textarea {
            width: 100%; padding: 12px 16px;
            background: #0a0a0f; border: 1px solid #1e1e2e;
            border-radius: 8px; color: #e2e8f0; font-size: 0.9rem;
            font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus { border-color: #7c5cfc; }
        select option { background: #0f0f1a; }
        textarea { resize: vertical; min-height: 100px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .divider {
            border: none; border-top: 1px solid #1e1e2e;
            margin: 28px 0;
        }

        .section-label-sm {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: #4a4a6a; margin-bottom: 16px;
        }

        .submit-btn {
            width: 100%; padding: 14px; background: #7c5cfc;
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: background 0.15s;
            margin-top: 8px;
        }
        .submit-btn:hover { background: #6d4ef0; }

        .success-msg {
            background: #052e16; border: 1px solid #22c55e33;
            color: #22c55e; padding: 14px 18px; border-radius: 10px;
            margin-bottom: 24px; font-size: 0.875rem;
        }

        .back-link { color: #4a4a6a; font-size: 0.8rem; text-decoration: none; display: inline-block; margin-bottom: 24px; }
        .back-link:hover { color: #7c5cfc; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">KALIBRE</a>
</nav>

<div class="page-wrapper">
    <a href="/" class="back-link">← Back to home</a>

    <div class="page-header">
        <h1>Book an Appointment</h1>
        <p>Fill in your details and we'll confirm your slot within 24 hours.</p>
    </div>

    <div class="form-card">
        {% if success %}
        <div class="success-msg">
            ✅ Booking received! We'll send a confirmation to your email shortly.
        </div>
        {% endif %}

        <div class="section-label-sm">Your Details</div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="e.g. Adaeze Okonkwo" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <hr class="divider">
            <div class="section-label-sm">Appointment Details</div>

            <div class="form-group">
                <label>Service Type</label>
                <select name="service">
                    <option value="">Select a service...</option>
                    <option>ML Strategy Session (60 min)</option>
                    <option>Model Audit & Review (90 min)</option>
                    <option>Data Pipeline Consultation (60 min)</option>
                    <option>ML Implementation Kickoff (45 min)</option>
                    <option>AI Product Advisory (60 min)</option>
                    <option>Follow-up Review (30 min)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" name="time" required>
                </div>
            </div>

            <div class="form-group">
                <label>Additional Notes</label>
                <textarea name="notes" placeholder="Anything we should know before the session..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Confirm Booking →</button>
        </form>
    </div>
</div>

</body>
</html>
