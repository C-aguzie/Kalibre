<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalibre — Booking Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #0f0f1a; border: 1px solid #1e1e2e; border-radius: 16px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 20px; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: 12px; }
        p { color: #6b6b8a; font-size: 0.9rem; line-height: 1.7; margin-bottom: 28px; }
        .btn { display: inline-block; background: #7c5cfc; color: white; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .btn:hover { background: #6d4ef0; }
        .btn-outline { display: inline-block; margin-left: 12px; color: #7c5cfc; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid #7c5cfc33; }
        .btn-outline:hover { background: #1e1040; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>Booking Confirmed!</h1>
    <p>Thanks for booking with Kalibre. We've sent a confirmation to your email. Our team will be in touch within 24 hours to confirm your slot.</p>
    <a href="/" class="btn">Back to Home</a>
    <a href="/booking/" class="btn-outline">Book Another</a>
</div>
</body>
</html>
