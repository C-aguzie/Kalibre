<!DOCTYPE html>
<html>
<head>
    <title>Kalibre — Enter Invite Code</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
        .logo { font-size: 1.6rem; font-weight: 700; color: #4f46e5; margin-bottom: 6px; }
        .subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 28px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input[type=text] { width: 100%; padding: 11px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; }
        input[type=text]:focus { border-color: #4f46e5; }
        button { width: 100%; margin-top: 18px; padding: 12px; background: #4f46e5; color: white; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #4338ca; }
        .error { background: #fef2f2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Kalibre</div>
    <p class="subtitle">Staff access only. Enter your invite code to continue.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_code">Invite Code</label>
        <input type="text" name="code" id="id_code" placeholder="Paste your invite code here">
        <button type="submit">Validate Code →</button>
    </form>
</div>
</body>
</html>
